<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Hydra IDE — Conceptos de logo</title>
<style>
  body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; background:#1e1e1e; color:#ddd; padding:32px; }
  h1 { font-weight:300; letter-spacing:1px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:24px; margin-top:24px; }
  .card { background:#252526; border:1px solid #333; border-radius:12px; padding:20px; }
  .name { font-size:13px; text-transform:uppercase; letter-spacing:1px; color:#9cdcfe; margin-bottom:16px; }
  .big { display:flex; justify-content:center; align-items:center; gap:24px; }
  .big img { width:160px; height:160px; }
  .sizes { display:flex; align-items:center; gap:18px; margin-top:18px; padding-top:16px; border-top:1px solid #333; }
  .sizes .lbl { font-size:11px; color:#888; width:60px; }
  .row { display:flex; align-items:center; gap:14px; }
  .light { background:#f3f3f3; border-radius:8px; padding:8px; }
  .titlebar { display:flex; align-items:center; gap:8px; background:#3c3c3c; padding:6px 12px; border-radius:6px; font-size:12px; }
  .titlebar img { width:16px; height:16px; }
</style>
</head>
<body>
  <h1>Hydra IDE — Conceptos de logo 🐉</h1>
  <p style="color:#888">Mirá cada uno en grande, en tamaños chicos y en la barra de título. Decime cuál te gusta (o mezcla de dos) y lo dejo redondo.</p>
  <div class="grid">
    <div class="card">
      <div class="name">A · Emblema (3 cabezas)</div>
      <div class="big"><img src="concept-emblem.svg" alt="A"></div>
      <div class="sizes">
        <span class="lbl">Tamaños</span>
        <div class="row">
          <img src="concept-emblem.svg" width="48" height="48">
          <img src="concept-emblem.svg" width="24" height="24">
          <img src="concept-emblem.svg" width="16" height="16">
          <span class="light"><img src="concept-emblem.svg" width="40" height="40"></span>
          <span class="titlebar"><img src="concept-emblem.svg"> Hydra IDE</span>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="name">B · Monograma "H" hidra</div>
      <div class="big"><img src="concept-monogram.svg" alt="B"></div>
      <div class="sizes">
        <span class="lbl">Tamaños</span>
        <div class="row">
          <img src="concept-monogram.svg" width="48" height="48">
          <img src="concept-monogram.svg" width="24" height="24">
          <img src="concept-monogram.svg" width="16" height="16">
          <span class="light"><img src="concept-monogram.svg" width="40" height="40"></span>
          <span class="titlebar"><img src="concept-monogram.svg"> Hydra IDE</span>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="name">C · Glifo código + serpiente</div>
      <div class="big"><img src="concept-glyph.svg" alt="C"></div>
      <div class="sizes">
        <span class="lbl">Tamaños</span>
        <div class="row">
          <img src="concept-glyph.svg" width="48" height="48">
          <img src="concept-glyph.svg" width="24" height="24">
          <img src="concept-glyph.svg" width="16" height="16">
          <span class="light"><img src="concept-glyph.svg" width="40" height="40"></span>
          <span class="titlebar"><img src="concept-glyph.svg"> Hydra IDE</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
