<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hydra IDE">
  <defs>
    <linearGradient id="snakeBody" x1=".1" y1="1" x2=".9" y2="0">
      <stop offset="0" stop-color="#15c2c8"/>
      <stop offset=".5" stop-color="#2f8eff"/>
      <stop offset="1" stop-color="#6a5cff"/>
    </linearGradient>
    <linearGradient id="snakeLit" x1=".1" y1="1" x2=".9" y2="0">
      <stop offset="0" stop-color="#62f2e8"/>
      <stop offset=".5" stop-color="#7cc4ff"/>
      <stop offset="1" stop-color="#b0a3ff"/>
    </linearGradient>
  </defs>

  <!-- chevrons de código  </>  (planos y subordinados) -->
  <g fill="#39597f">
    <polygon points="92,82 58,128 92,174 92,156 80,128 92,100"/>
    <polygon points="164,82 198,128 164,174 164,156 176,128 164,100"/>
  </g>

  <!-- cuerpo de la serpiente: banda angular + cresta de luz (estilo origami) -->
  <path d="M150 66 L120 112 L144 150 L110 198"
        fill="none" stroke="url(#snakeBody)" stroke-width="30"
        stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M150 66 L120 112 L144 150 L110 198"
        fill="none" stroke="url(#snakeLit)" stroke-width="10"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- cola afinada -->
  <path d="M110 198 l -15 7" fill="none" stroke="url(#snakeBody)"
        stroke-width="11" stroke-linecap="round"/>

  <!-- cabeza facetada (low-poly) -->
  <polygon points="150,66 180,44 192,76 164,92" fill="url(#snakeBody)"/>
  <polygon points="150,66 180,44 168,68" fill="url(#snakeLit)"/>
  <!-- ojo angular -->
  <polygon points="170,62 178,58 181,66 173,70" fill="#0e1b2e"/>
</svg>
