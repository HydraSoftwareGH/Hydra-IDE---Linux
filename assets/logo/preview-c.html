<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Hydra IDE — Logo C (mejorado)</title>
<style>
  body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; background:#1e1e1e; color:#ddd; padding:40px; }
  h1 { font-weight:300; letter-spacing:1px; }
  .stage { display:flex; gap:40px; align-items:center; flex-wrap:wrap; margin-top:24px; }
  .hero { width:220px; height:220px; }
  .panel { background:#252526; border:1px solid #333; border-radius:14px; padding:24px; }
  .light { background:#f3f3f3; }
  .sizes { display:flex; align-items:center; gap:22px; margin-top:30px; padding-top:22px; border-top:1px solid #333; }
  .sizes .lbl { font-size:12px; color:#888; width:70px; }
  .titlebar { display:inline-flex; align-items:center; gap:8px; background:#3c3c3c; padding:7px 14px; border-radius:7px; font-size:12px; color:#ccc; }
  .titlebar img { width:16px; height:16px; }
  .taskbar { display:inline-flex; gap:10px; background:#202020; padding:10px; border-radius:10px; }
  .taskbar img { width:32px; height:32px; }
</style>
</head>
<body>
  <h1>Hydra IDE — Logo C (código + serpiente) · mejorado 🐍</h1>
  <div class="stage">
    <div class="panel"><img class="hero" src="concept-glyph.svg"></div>
    <div class="panel light"><img class="hero" src="concept-glyph.svg"></div>
  </div>
  <div class="sizes">
    <span class="lbl">Íconos</span>
    <img src="concept-glyph.svg" width="64" height="64">
    <img src="concept-glyph.svg" width="48" height="48">
    <img src="concept-glyph.svg" width="32" height="32">
    <img src="concept-glyph.svg" width="24" height="24">
    <img src="concept-glyph.svg" width="16" height="16">
  </div>
  <div class="sizes">
    <span class="lbl">En uso</span>
    <span class="titlebar"><img src="concept-glyph.svg"> Hydra IDE</span>
    <span class="taskbar"><img src="concept-glyph.svg"></span>
  </div>
</body>
</html>
